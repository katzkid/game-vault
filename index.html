<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Game Vault</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-card: #111827;
      --border: #1f2937;
      --border-accent: #374151;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats-group { display: flex; gap: 1rem; align-items: center; }
    .stat-pill {
      background: #1f2937;
      border: 1px solid var(--border-accent);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.825rem;
    }
    .stat-pill span { color: var(--primary); font-weight: 700; }
    main { flex: 1; width: 100vw; padding: 1.5rem; }
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow-x: auto;
    }
    table.dataTable { width: 100% !important; border-collapse: collapse !important; color: var(--text); font-size: 0.875rem; }
    table.dataTable thead th {
      background-color: #1e293b !important;
      color: #94a3b8 !important;
      text-transform: uppercase;
      font-size: 0.725rem;
      letter-spacing: 0.05em;
      padding: 12px 14px !important;
      border-bottom: 2px solid var(--border-accent) !important;
      white-space: nowrap;
    }
    table.dataTable tbody tr { background-color: transparent !important; border-bottom: 1px solid var(--border); }
    table.dataTable tbody tr:hover { background-color: rgba(99, 102, 241, 0.08) !important; }
    table.dataTable tbody td { padding: 12px 14px !important; white-space: nowrap; }
    .badge { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .badge-code { background: #1e293b; color: #38bdf8; border: 1px solid #334155; font-family: monospace; }
    .badge-val { color: #fbbf24; font-weight: 600; }
    #status-msg { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 1rem; }
    .dataTables_filter input {
      background: #1f2937;
      border: 1px solid var(--border-accent);
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      outline: none;
      margin-left: 0.5rem;
    }
    .dataTables_length select {
      background: #1f2937;
      border: 1px solid var(--border-accent);
      color: #fff;
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      margin: 0 0.4rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <h1>Video Game Vault</h1>
    </div>
    <div class="stats-group">
      <div class="stat-pill">Total Games: <span id="stat-count">-</span></div>
      <div class="stat-pill">Est. Value: <span id="stat-val">-</span></div>
    </div>
  </header>

  <main>
    <div class="table-card">
      <div id="status-msg">Reading games.csv...</div>
      <div id="table-wrapper" style="display:none;">
        <table id="collectionTable" class="display nowrap" style="width:100%;">
          <thead id="tbl-header"></thead>
          <tbody id="tbl-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    Papa.parse("games.csv", {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        if (!results.data || results.data.length === 0) {
          document.getElementById('status-msg').innerHTML = 
            '<span style="color:#f87171;">⚠️ games.csv was found, but it has no rows.</span>';
          return;
        }

        const data = results.data;
        const fields = results.meta.fields.filter(f => f && f.trim() !== "");

        const headerRow = document.createElement('tr');
        fields.forEach(f => {
          const th = document.createElement('th');
          th.textContent = f.replace(/_/g, ' ');
          headerRow.appendChild(th);
        });
        document.getElementById('tbl-header').appendChild(headerRow);

        const columns = fields.map(f => ({
          data: f,
          defaultContent: "",
          render: function(val, type) {
            if (type !== 'display' || !val) return val;
            if (f === 'ID' || f.includes('Catalog') || f.includes('Product')) {
              return '<span class="badge badge-code">' + val + '</span>';
            }
            if (f.includes('Price') || f.includes('Value')) {
              const num = parseFloat(val);
              return !isNaN(num) ? '<span class="badge-val">€' + num.toFixed(2) + '</span>' : val;
            }
            return val;
          }
        }));

        let totalVal = 0;
        data.forEach(item => {
          const v = parseFloat(item.Current_Estimated_Value || item.Estimated_Value_CIB || item.Purchase_Price || 0);
          if (!isNaN(v)) totalVal += v;
        });
        document.getElementById('stat-count').textContent = data.length;
        document.getElementById('stat-val').textContent = "€" + totalVal.toFixed(2);

        document.getElementById('status-msg').style.display = 'none';
        document.getElementById('table-wrapper').style.display = 'block';

        $('#collectionTable').DataTable({
          data: data,
          columns: columns,
          pageLength: 25,
          scrollX: true,
          order: [[1, 'asc']],
          language: {
            search: "Search Collection: ",
            searchPlaceholder: "Title, catalog no, tag..."
          }
        });
      },
      error: function(err) {
        document.getElementById('status-msg').innerHTML = `
          <div style="color: #f87171; text-align: left; max-width: 650px; margin: 0 auto; line-height: 1.6;">
            <p><strong>⚠️ Cannot load games.csv:</strong> ${err.message || 'File not found or blocked'}</p>
            <p style="margin-top: 8px; font-size: 0.9rem; color: #cbd5e1;">
              Please check:
              <br>1. Can you open <code>https://&lt;your-site&gt;/games.csv</code> directly in the address bar?
              <br>2. Is the file in the repository named strictly <code>games.csv</code> in lowercase?
            </p>
          </div>`;
      }
    });
  </script>
</body>
</html>
