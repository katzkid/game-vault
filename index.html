<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Game Vault</title>
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-surface: #111827;
      --bg-card: rgba(17, 24, 39, 0.95);
      --border-subtle: #1f2937;
      --border-accent: #374151;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats-group { display: flex; gap: 1rem; align-items: center; }
    .stat-pill {
      background: #1f2937;
      border: 1px solid var(--border-accent);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.825rem;
    }
    .stat-pill span { color: var(--primary); font-weight: 700; }
    main { flex: 1; width: 100vw; padding: 1.5rem; }
    
    /* Filter Bar Styling */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 1rem 1.25rem;
      border-radius: 12px;
    }
    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .filter-item label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .filter-select {
      background: #1f2937;
      color: #f9fafb;
      border: 1px solid var(--border-accent);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-size: 0.825rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .filter-select:focus {
      border-color: var(--primary);
    }
    .btn-reset {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-accent);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: auto;
      transition: all 0.2s;
    }
    .btn-reset:hover {
      background: #1f2937;
      color: #fff;
      border-color: #6b7280;
    }

    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow-x: auto;
    }
    table.dataTable { width: 100% !important; border-collapse: collapse !important; color: var(--text-main); font-size: 0.875rem; }
    table.dataTable thead th {
      background-color: #1e293b !important;
      color: #94a3b8 !important;
      text-transform: uppercase;
      font-size: 0.725rem;
      letter-spacing: 0.05em;
      padding: 12px 14px !important;
      border-bottom: 2px solid var(--border-accent) !important;
      white-space: nowrap;
    }
    table.dataTable tbody tr { background-color: transparent !important; border-bottom: 1px solid var(--border-subtle); }
    table.dataTable tbody tr:hover { background-color: rgba(99, 102, 241, 0.08) !important; }
    table.dataTable tbody td { padding: 12px 14px !important; white-space: nowrap; }
    .badge { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .badge-code { background: #1e293b; color: #38bdf8; border: 1px solid #334155; font-family: monospace; }
    .badge-val { color: #fbbf24; font-weight: 600; }
    #loader { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 1rem; line-height: 1.6; }
    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 1.25rem;
      border-radius: 8px;
      max-width: 600px;
      margin: 0 auto;
      text-align: left;
    }
    .error-box code {
      background: #1f2937;
      padding: 2px 6px;
      border-radius: 4px;
      color: #f87171;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <h1>Video Game Vault</h1>
    </div>
    <div class="stats-group">
      <div class="stat-pill">Total Games: <span id="stat-count">-</span></div>
      <div class="stat-pill">Est. Value: <span id="stat-val">-</span></div>
    </div>
  </header>

  <main>
    <!-- Dynamic Filters -->
    <div class="filter-bar" id="filter-bar" style="display:none;">
      <div class="filter-item">
        <label for="filter-platform">Platform</label>
        <select id="filter-platform" class="filter-select"><option value="">All Platforms</option></select>
      </div>
      <div class="filter-item">
        <label for="filter-region">Region</label>
        <select id="filter-region" class="filter-select"><option value="">All Regions</option></select>
      </div>
      <div class="filter-item">
        <label for="filter-completeness">Completeness</label>
        <select id="filter-completeness" class="filter-select"><option value="">All Types</option></select>
      </div>
      <div class="filter-item">
        <label for="filter-status">Play Status</label>
        <select id="filter-status" class="filter-select"><option value="">All Statuses</option></select>
      </div>
      <button class="btn-reset" onclick="resetFilters()">Reset Filters</button>
    </div>

    <div class="table-card">
      <div id="loader">
        <p>Loading collection from <code>games.csv</code>...</p>
      </div>
      <div id="table-wrapper" style="display:none;">
        <table id="collectionTable" class="display nowrap" style="width:100%;"></table>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    let dataTableInstance = null;
    let columnIndexMap = {};

    function showError(title, message, fix) {
      document.getElementById('loader').innerHTML = `
        <div class="error-box">
          <h3 style="font-size:1.1rem; font-weight:700; margin-bottom:8px; color:#f87171;">⚠️ ${title}</h3>
          <p style="margin-bottom:8px;">${message}</p>
          <div style="font-size:0.875rem; color:#cbd5e1; border-top:1px solid rgba(239,68,68,0.2); padding-top:8px;">
            <strong>How to fix:</strong> ${fix}
          </div>
        </div>`;
    }

    async function loadCollection() {
      if (window.location.protocol === 'file:') {
        showError(
          "Opened via Local File Protocol",
          "Browsers block <code>fetch()</code> requests when opening HTML files directly from your desktop.",
          "Push this file to GitHub Pages or run a local web server."
        );
        return;
      }

      let csvText = "";
      try {
        const response = await fetch('games.csv?t=' + Date.now());
        if (response.status === 404) {
          showError(
            "games.csv Not Found (404)",
            "Could not locate <code>games.csv</code> in repository root.",
            "Make sure your file is committed as <code>games.csv</code> alongside <code>index.html</code>."
          );
          return;
        }
        if (!response.ok) throw new Error("HTTP " + response.status + " " + response.statusText);
        csvText = await response.text();
      } catch (err) {
        showError("Fetch Error", err.message, "Inspect browser console (F12).");
        return;
      }

      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (!results.data || results.data.length === 0) {
            showError("Empty CSV", "No data rows found in games.csv.", "Add game entries to CSV.");
            return;
          }
          try {
            initDataTable(results.data, results.meta.fields);
          } catch (initErr) {
            showError("Render Error", initErr.message, "Inspect console (F12).");
          }
        }
      });
    }

    function initDataTable(data, rawHeaders) {
      const fields = rawHeaders.filter(h => h && h.trim() !== "");
      
      const columns = fields.map((col, idx) => {
        columnIndexMap[col] = idx;
        let title = col.replace(/_/g, ' ');
        return {
          title: title,
          data: col,
          defaultContent: "",
          render: function(cellData, type, row) {
            if (type !== 'display' || !cellData) return cellData;
            if (col === 'ID' || col.includes('Catalog') || col.includes('Product')) {
              return `<span class="badge badge-code">${cellData}</span>`;
            }
            if (col.includes('Price') || col.includes('Value')) {
              const num = parseFloat(cellData);
              return !isNaN(num) ? `<span class="badge-val">€${num.toFixed(2)}</span>` : cellData;
            }
            return cellData;
          }
        };
      });

      function updateStats() {
        if (!dataTableInstance) return;
        const filteredData = dataTableInstance.rows({ filter: 'applied' }).data().toArray();
        let totalVal = 0;
        filteredData.forEach(item => {
          const val = parseFloat(item.Current_Estimated_Value || item.Estimated_Value_CIB || item.Purchase_
