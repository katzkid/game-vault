name: Daily Game Price Sync

on:
  schedule:
    # Runs everyday at midnight UTC (00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime via a button

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Price Updater
        run: python update_prices.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add games.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update collection market prices [skip ci]" && git push)
